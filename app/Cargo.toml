[package]
name = "sterling-quest-sync"
version = "0.1.30"
edition = "2024"
description = "Sterling Quest Sync desktop app"
license = "MIT"

[build-dependencies]
tauri-build = "2"

[dependencies]
dirs = "7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqs-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }
